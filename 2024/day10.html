<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        (async function(){
            const gap = 80;
            const thickness = 10;
            let offset = (gap+thickness)/2;
            const allDirs = [{x:0, y:1}, {x:1, y:0}, {x:0, y:-1}, {x:-1, y:0}];
            const winPromise = new Promise(resolve => window.addEventListener("load",()=>resolve()));
            const fetchPromise = new Promise(resolve=>
            fetch("day10.txt").then(d => d.text()).then(d=>resolve(d))
            );
            await Promise.all([winPromise, fetchPromise]);
            const data = (await fetchPromise).split("\r\n").map(a=>a.split("").map(a => Number(a)));
            const canvas = document.getElementsByTagName("canvas")[0];
            canvas.width = data[0].length*gap;
            canvas.height = data.length*gap;
            const ctx = canvas.getContext("2d");
            for(let y=0;y<data.length;y++) {
                for(let x=0;x<data.length;x++) {
                    ctx.fillStyle = getClr(data[y][x]);
                    ctx.fillRect(x*gap, y*gap, gap, gap);
                }
            }
            let result = 0;
            for(let y=0;y<data.length;y++) {
                for(let x=0;x<data.length;x++) {
                    if(data[y][x]===0) {
                        result += Track(x,y,0, [{x:x, y:y}]);
                    }
                }
            }
            console.log(result);
            function Track(x, y, current, path) {
                if(isInvalid(x,y)) return 0;
                else if(current === 9) {
                    drawPath(path);
                    return 1;
                }
                let res = 0;
                let nextCurrent = current+1;
                for(let dir of allDirs)
                {
                    var newDir= {x:x+dir.x, y:y+dir.y};
                    if(!isInvalid(newDir.x, newDir.y) && nextCurrent===data[newDir.y][newDir.x]) {
                        res+=Track(newDir.x, newDir.y, nextCurrent,[...path, newDir]);
                    }
                }
                return res;
            }
            function isInvalid(x,y) {return (x<0 ||y<0 || x>=data[0].length || y>=data.length);}
            function getClr(val)
            {
                return `#${(val*0x10).toString(16)}${(val*0x12).toString(16)}${(val*0x14).toString(16)}`;
            }
            function getClr2(val)
            {
                return `#${((val*0x10)%0x80+0x80).toString(16).padStart(2,'0')}${((val*0x24)%0x80+0x80).toString(16).padStart(2,'0')}${((val*0x4c)%0x80+0x80).toString(16).padStart(2,'0')}`;
            }

            function drawPath(paths) {
                drawPathEach(paths);
            }
            async function drawPathEach(paths) {
                for(let i=0;i<paths.length-1;i++) {
                    let point1 = paths[i];
                    let point2 = paths[i+1];
                    ctx.beginPath();
                    ctx.lineWidth = thickness;
                    ctx.strokeStyle = getClr2(i);
                    ctx.moveTo(point1.x*gap+offset, point1.y*gap+offset);
                    ctx.lineTo(point2.x*gap+offset, point2.y*gap+offset);
                    ctx.stroke();
                    ctx.closePath();
                    await new Promise(resolve => setTimeout(resolve, 50));
                }
            }
        })();
    </script>
</head>
<body>
<canvas></canvas>    
</body>
</html>
