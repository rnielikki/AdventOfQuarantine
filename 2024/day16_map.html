<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        (async function () {
            const winPromise = new Promise(resolve => window.addEventListener("load", () => resolve()));
            const fetchPromise = new Promise(resolve =>
                fetch("day16.txt").then(d => d.text()).then(d => resolve(d))
            );
            await Promise.all([winPromise, fetchPromise]);
            const data = (await fetchPromise).split("\n").map(m =>m.split(''));
            const canvas = document.getElementsByTagName("canvas")[0];
            const ctx = canvas.getContext("2d");
            printData(data);
            function printData(input) {
                let w = input[0].length;
                let h = input.length;
                canvas.width=w;
                canvas.height=h;
                let len = w*h;
                let arr = new Uint8ClampedArray(len<<2);
                for(let i=0;i<len;i++) {
                    let d = input[Math.floor(i/w)][Math.floor(i%w)];
                    switch(d) {
                        case '#':
                            arr[i*4] = 0;
                            arr[i*4+1] =0;
                            arr[i*4+2] = 0;
                            break;
                        case 'S':
                            arr[i*4] = 0;
                            arr[i*4+1] = 0;
                            arr[i*4+2] = 255;
                            break;
                        case 'E':
                            arr[i*4] = 255;
                            arr[i*4+1] = 0;
                            arr[i*4+2] = 0;
                            break;
                        case '.':
                            arr[i*4] = 255;
                            arr[i*4+1] = 255;
                            arr[i*4+2] = 255;
                            break;
                        default:
                            continue;
                    }
                    arr[i*4+3] = 255;
                }
                let imgData = new ImageData(arr,w,h);
                ctx.putImageData(imgData, 0,0);
            }
        })();
    </script>
</head>
<body>
    <canvas></canvas>
</body>
</html>
